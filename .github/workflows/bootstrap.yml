name: Bootstrap source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/archive.b64.03'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Unpack source
        run: |
          cat .bootstrap/archive.b64.* | base64 --decode > pi-gvs-lite-publish.zip
          unzip -o pi-gvs-lite-publish.zip -d .
          rm -rf .bootstrap pi-gvs-lite-publish.zip .github/workflows/bootstrap.yml
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Initial pi-gvs-lite source"
          git push
